name: Цены и сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # каждые 6 часов
  workflow_dispatch:
    inputs:
      quick:
        description: 'Только пересобрать сайт (без обхода Steam)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: База предметов (ByMykel/CSGO-API)
        run: node scripts/build-db.mjs || echo "::warning::не удалось обновить базу — собираю из закоммиченной"
      - name: Другие предметы (агенты, кейсы, брелоки, граффити…)
        run: node scripts/build-items.mjs || echo "::warning::другие предметы не обновились — беру закоммиченные"
      - name: Мировой рейтинг команд (Valve Regional Standings)
        run: |
          git clone -q --depth 1 https://github.com/ValveSoftware/counter-strike_regional_standings /tmp/vrs \
            && node scripts/build-rankings.mjs --dir /tmp/vrs || echo "::warning::рейтинг VRS не обновился"
      - name: Загрузить хранилище цен
        run: scripts/store.sh pull prices
      - name: Текущие цены (Steam, Skinport, курс ЦБ)
        run: |
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.quick }}" = "true" ]; } && [ -f store/prices/current.json ]; then
            echo "push: обновляю только Skinport и курс"; SKIP_STEAM=1 node scripts/fetch-prices.mjs
          else
            STEAM_BUDGET_MIN=30 node scripts/fetch-prices.mjs
          fi
      - name: Сохранить хранилище цен
        if: always()
        run: scripts/store.sh push prices
      - name: Загрузить историю Steam
        run: scripts/store.sh pull history
      - name: Данные для сайта
        run: node scripts/build-site-data.mjs
      - name: Раскидки, коллауты и игроки из про-демок
        run: |
          scripts/store.sh pull nades-site
          if [ -d store/nades-site ]; then cp -r store/nades-site/. public/data/; fi
      - name: Профили игроков — соцсети, FACEIT (Liquipedia + FACEIT API)
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: |
          scripts/store.sh pull matches-hist
          scripts/store.sh pull faceit
          if [ -n "$FACEIT_API_KEY" ]; then
            node scripts/fetch-faceit.mjs && scripts/store.sh push faceit || echo "::warning::FACEIT не обновился"
          fi
          node scripts/build-player-links.mjs || echo "::warning::профили игроков не собраны"
      - name: Логотипы команд и иконки турниров (Liquipedia API)
        run: |
          scripts/store.sh pull logos
          if node scripts/fetch-logos.mjs; then scripts/store.sh push logos; else echo "::warning::логотипы не обновились"; fi
      - name: Аватары игроков (Steam)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/fetch-avatars.mjs || true
      - name: Сборка
        run: npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # ~240 MB and tens of thousands of files (maps, lineups, price history): syncing takes over 10 minutes
          timeout: 1800000
