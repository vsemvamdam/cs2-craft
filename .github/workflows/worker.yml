name: Сервер статистики (Cloudflare Worker)

# Разворачивает worker/ (поиск профилей Steam, рейтинг, инвентарь) на Cloudflare Workers и
# записывает его адрес в public/data/api.json — сайт берёт адрес оттуда.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STEAM_API_KEY
# (как их получить — README, раздел «Статистика Steam и CS2»). Без них workflow просто пропускается.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Проверить секреты
        id: s
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STEAM_API_KEY" ] || missing="$missing STEAM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Не заданы секреты:$missing — сервер статистики не развёрнут (раздел «Статистика» покажет, что он подключается)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.s.outputs.skip != '1'
        with:
          node-version: 22
      - name: База рейтинга (D1) и развёртывание
        id: d
        if: steps.s.outputs.skip != '1'
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          find_db() { npx wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const l=JSON.parse(s);const d=l.find(x=>x.name==='cs2-craft-stats');process.stdout.write(d?(d.uuid||d.id||''):'')}catch{}})"; }
          id=$(find_db)
          if [ -z "$id" ]; then npx wrangler d1 create cs2-craft-stats; id=$(find_db); fi
          if [ -z "$id" ]; then echo "::error::Не удалось создать базу D1 — проверьте, что у токена есть право Account · D1 · Edit"; exit 1; fi
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          npx wrangler d1 execute cs2-craft-stats --remote --file=schema.sql
          npx wrangler deploy 2>&1 | tee deploy.log
          printf '%s' "$STEAM_API_KEY" | npx wrangler secret put STEAM_API_KEY
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Не нашёл адрес *.workers.dev — откройте в Cloudflare раздел Workers & Pages и выберите поддомен workers.dev"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl -fsS "$url/api/health" || true
      - name: Адрес сервера для сайта
        if: steps.s.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"stats":"%s"}\n' "${{ steps.d.outputs.url }}" > public/data/api.json
          git config user.name "worker-bot"
          git config user.email "worker-bot@users.noreply.github.com"
          git add public/data/api.json
          if git diff --cached --quiet; then echo "адрес не изменился"; exit 0; fi
          git commit -m "Статистика: адрес сервера профилей"
          git pull --rebase -q origin main
          git push
