name: Раскидки — вся база про-демок

# Разбирает весь открытый архив OpenCS2 (Hugging Face blanchon/opencs2_dataset_demo, CC BY 4.0,
# ~2000 карт HLTV) порциями: каждый запуск — до LIMIT демок в SHARDS параллельных задачах.
# Запускается каждые 4 часа, пока не разберёт всё; уже разобранное не трогает.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько демок за запуск'
        default: '120'
      shards:
        description: 'Параллельных задач'
        default: '8'
  schedule:
    - cron: '7 */4 * * *'
  push:
    branches: [main]
    paths: ['tools/demos/opencs2.py', '.github/workflows/nades-all.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: nades-all
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      count: ${{ steps.p.outputs.count }}
      matrix: ${{ steps.p.outputs.matrix }}
      remaining: ${{ steps.p.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub pandas pyarrow
      - id: p
        run: python3 tools/demos/opencs2.py plan --limit "${{ inputs.limit || '120' }}" --shards "${{ inputs.shards || '8' }}" --out plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install demoparser2 huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Разбор своей части демок
        run: python3 tools/demos/opencs2.py shard --plan plan.json --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.shard }}
          path: store/nades-raw-new/
          if-no-files-found: ignore
          retention-days: 3

  aggregate:
    needs: [plan, shard]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: store/nades-raw-new
          merge-multiple: true
      - name: Объединить с базой бросков
        run: |
          scripts/store.sh pull nades-raw
          mkdir -p store/nades-raw
          cat store/nades-raw-new/_done-*.txt > done.txt 2>/dev/null || touch done.txt
          rm -f store/nades-raw-new/_done-*.txt
          cp -n store/nades-raw-new/*.json store/nades-raw/ 2>/dev/null || true
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('tools/demos/processed.json')
          done = set(json.loads(p.read_text())) if p.exists() else set()
          done |= {l.strip() for l in open('done.txt') if l.strip()}
          p.write_text(json.dumps(sorted(done), ensure_ascii=False, indent=0))
          print('разобрано всего', len(done))
          PY
      - name: Собрать раскидки
        run: python3 tools/demos/build_lineups.py --seed-from-public
      - name: Сохранить и пересобрать сайт
        run: |
          scripts/store.sh push nades-raw
          git config user.name "nades-bot"
          git config user.email "nades-bot@users.noreply.github.com"
          git add public/data/nades/ tools/demos/processed.json
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "Раскидки: +демки из OpenCS2 (осталось ${{ needs.plan.outputs.remaining }})"
          git pull --rebase -q origin main
          git push
          gh workflow run site.yml -f quick=true
