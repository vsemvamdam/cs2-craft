name: Раскидки из демок

# Разбирает турнирные демки из tools/demos/urls.txt и обновляет public/data/nades/<карта>.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/demos/urls.txt']

permissions:
  contents: write
  actions: write

concurrency:
  group: nades
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Распаковщики архивов
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq unrar || sudo apt-get install -y -qq unar) && sudo apt-get install -y -qq p7zip-full
      - run: pip install demoparser2
      - name: Разбор демок
        run: python3 tools/demos/extract_nades.py --from-urls tools/demos/urls.txt
      - name: Сохранить и пересобрать сайт
        run: |
          git config user.name "nades-bot"
          git config user.email "nades-bot@users.noreply.github.com"
          git add public/data/nades/*.json
          if git diff --cached --quiet; then echo "нет новых бросков"; exit 0; fi
          git commit -m "Раскидки: обновлено из демок"
          git push
          gh workflow run site.yml -f quick=true
