name: Раскидки из демок

# Разбирает про-демки и обновляет public/data/nades/<карта>.json:
#  * ссылки из tools/demos/urls.txt (архивы демок, например загруженные в Release);
#  * по желанию — датасет CounterQuant на Hugging Face (сейчас закрыт: отвечает 401).
on:
  workflow_dispatch:
    inputs:
      hf:
        description: 'Попробовать датасет CounterQuant (Hugging Face)'
        type: boolean
        default: false
      per_map:
        description: 'Сколько новых демок на карту (для датасета)'
        default: '4'
  push:
    branches: [main]
    paths: ['tools/demos/urls.txt']

permissions:
  contents: write
  actions: write

concurrency:
  group: nades
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Распаковщики архивов
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq unrar || sudo apt-get install -y -qq unar) && sudo apt-get install -y -qq p7zip-full zstd
      - run: pip install demoparser2 huggingface_hub
      - name: Свежие про-матчи (CounterQuant / HLTV)
        if: ${{ inputs.hf }}
        continue-on-error: true
        run: python3 tools/demos/fetch_hf.py --per-map "${{ inputs.per_map || '4' }}"
      - name: Свои ссылки из urls.txt
        continue-on-error: true
        run: |
          if ! grep -qvE '^\s*(#|$)' tools/demos/urls.txt; then echo "в urls.txt ссылок нет"; exit 0; fi
          python3 tools/demos/extract_nades.py --from-urls tools/demos/urls.txt
      - name: Сохранить и пересобрать сайт
        run: |
          git config user.name "nades-bot"
          git config user.email "nades-bot@users.noreply.github.com"
          git add public/data/nades/*.json tools/demos/processed.json tools/demos/last_run.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "Раскидки: новые броски из про-демок"
          git pull --rebase -q origin main
          git push
          gh workflow run site.yml -f quick=true
