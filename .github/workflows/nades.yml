name: Раскидки из своих демок

# Демки по ссылкам из tools/demos/urls.txt (например, архивы, загруженные в Release) →
# база бросков (релиз data-store, архив nades-raw) → библиотека раскидок на сайте.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/demos/urls.txt']


permissions:
  contents: write
  actions: write

concurrency:
  group: nades-all   # общий с «вся база про-демок»: оба пишут в одно хранилище бросков
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Распаковщики архивов
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq unrar || sudo apt-get install -y -qq unar) && sudo apt-get install -y -qq p7zip-full zstd
      - run: pip install demoparser2
      - name: База бросков
        run: scripts/store.sh pull nades-raw
      - name: Разбор демок из urls.txt
        run: |
          if ! grep -qvE '^\s*(#|$)' tools/demos/urls.txt; then echo "в urls.txt ссылок нет"; exit 0; fi
          python3 tools/demos/opencs2.py ingest --from-urls tools/demos/urls.txt
      - name: Собрать раскидки, коллауты и игроков
        run: python3 tools/demos/build_lineups.py --out store/nades-site
      - name: Сохранить
        run: |
          scripts/store.sh push nades-raw
          scripts/store.sh push nades-site
          gh workflow run site.yml -f quick=true
